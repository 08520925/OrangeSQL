name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            name: orangesql-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            name: orangesql-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            name: orangesql-darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            name: orangesql-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: OrangeSQL/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: OrangeSQL/frontend
        run: pnpm build

      - name: Build Go binary
        working-directory: OrangeSQL
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o ${{ matrix.name }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: OrangeSQL/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
